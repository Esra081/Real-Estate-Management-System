<!-- KURUMSAL ÜST MENÜ (NAVBAR) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2 shadow-sm" 
     *ngIf="auth.isLoggedIn"
     style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;">
  <div class="container-fluid px-4">
    
    <!-- Logo ve Sistem Adı -->
    <a class="navbar-brand fw-bold text-white fs-5" routerLink="/tasinmaz-liste">
      <span>REMS <span class="badge bg-primary-subtle text-primary-emphasis fs-6 fw-normal px-2 py-1 ms-1">GIS</span></span>
    </a>

    <!-- Sayfa Linkleri (Sadece Admin için Kullanıcı Yönetimi) -->
    <div class="navbar-nav me-auto ms-3 d-flex flex-row gap-2" *ngIf="auth.isAdmin">
      <a class="nav-link text-white-50 px-3 py-1 rounded" routerLink="/kullanici-yonetimi" routerLinkActive="text-white bg-primary fw-semibold">
        Kullanıcı Yönetimi
      </a>
    </div>

    <!-- Sağ Köşe: Dinamik Kullanıcı Rozeti & Çıkış -->
    <div class="d-flex align-items-center gap-3 ms-auto" *ngIf="auth.currentUser as user">
      <div class="d-flex align-items-center gap-2 text-white bg-white bg-opacity-10 px-3 py-1 rounded-pill border border-white border-opacity-10">
        <!-- Baş Harf -->
        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold" style="width: 28px; height: 28px; font-size: 13px;">
          {{ user.adSoyad.charAt(0).toUpperCase() }}
        </div>
        <div class="small leading-tight">
          <div class="fw-semibold">{{ user.adSoyad }}</div>
          <div class="text-white-50" style="font-size: 11px;">
            {{ user.rol === 'Admin' ? 'Yönetici (Admin)' : 'Kullanıcı' }}
          </div>
        </div>
      </div>

      <button type="button" class="btn btn-sm btn-outline-light border-opacity-25 text-white-50 px-3" (click)="cikisYap()">
        Çıkış Yap
      </button>
    </div>

  </div>
</nav>

<main>
  <router-outlet></router-outlet>
</main>
