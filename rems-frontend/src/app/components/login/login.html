<div class="rems-login-wrapper">
  <div class="rems-auth-card">
    
    <div class="text-center mb-4">
      <div class="auth-brand-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
          <line x1="9" y1="3" x2="9" y2="18"></line>
          <line x1="15" y1="6" x2="15" y2="21"></line>
        </svg>
      </div>
      <h3 class="auth-brand-title">
        REMS <span class="auth-brand-badge-gis">GIS</span>
      </h3>
      <p class="auth-subtitle">Gayrimenkul & Mekansal Bilgi Sistemi</p>
    </div>

    <div class="auth-tab-pill-container">
      <button type="button" 
              class="auth-tab-btn"
              [class.active]="aktifSekme === 'login'"
              (click)="sekmeDegistir('login')">
        Giriş Yap
      </button>
      <button type="button" 
              class="auth-tab-btn"
              [class.active]="aktifSekme === 'register'"
              (click)="sekmeDegistir('register')">
        Kayıt Ol
      </button>
    </div>

    <!-- Giriş Formu -->
    <form *ngIf="aktifSekme === 'login'" (ngSubmit)="onLogin()">
      <div class="auth-field-group">
        <label class="auth-label">E-Posta Adresi</label>
        <div class="auth-input-wrapper">
          <span class="auth-input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
          <input type="email" 
                 class="auth-input" 
                 [(ngModel)]="email" 
                 name="email" 
                 placeholder="admin@rems.com" 
                 required 
                 autocomplete="email">
        </div>
      </div>

      <div class="auth-field-group">
        <label class="auth-label">Şifre</label>
        <div class="auth-input-wrapper">
          <span class="auth-input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input [type]="sifreGorunur ? 'text' : 'password'" 
                 class="auth-input" 
                 [(ngModel)]="sifre" 
                 name="sifre" 
                 placeholder="••••••••" 
                 required 
                 autocomplete="current-password"
                 style="padding-right: 40px;">
          <button type="button" class="btn-toggle-eye" (click)="sifreGosterGizle()" title="Şifreyi Göster/Gizle">
            <svg *ngIf="!sifreGorunur" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="sifreGorunur" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-auth-submit" [disabled]="yukleniyor">
        <span *ngIf="yukleniyor" class="spinner-border spinner-border-sm"></span>
        <span>{{ yukleniyor ? 'Giriş Yapılıyor...' : 'Giriş Yap' }}</span>
      </button>
    </form>

    <!-- Kayıt Formu -->
    <form *ngIf="aktifSekme === 'register'" (ngSubmit)="onRegister()">
      <div class="auth-field-group">
        <label class="auth-label">Ad Soyad</label>
        <div class="auth-input-wrapper">
          <span class="auth-input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input type="text" 
                 class="auth-input" 
                 [(ngModel)]="registerAdSoyad" 
                 name="registerAdSoyad" 
                 placeholder="Adınız ve Soyadınız" 
                 required 
                 autocomplete="name">
        </div>
      </div>

      <div class="auth-field-group">
        <label class="auth-label">E-Posta Adresi</label>
        <div class="auth-input-wrapper">
          <span class="auth-input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
          <input type="email" 
                 class="auth-input" 
                 [(ngModel)]="registerEmail" 
                 name="registerEmail" 
                 placeholder="ornek@rems.com" 
                 required 
                 autocomplete="email">
        </div>
      </div>

      <div class="auth-field-group">
        <label class="auth-label">Şifre Belirleyin</label>
        <div class="auth-input-wrapper">
          <span class="auth-input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input [type]="sifreGorunur ? 'text' : 'password'" 
                 class="auth-input" 
                 [(ngModel)]="registerSifre" 
                 name="registerSifre" 
                 placeholder="8-12 karakterli şifre" 
                 required 
                 autocomplete="new-password"
                 style="padding-right: 40px;">
          <button type="button" class="btn-toggle-eye" (click)="sifreGosterGizle()" title="Şifreyi Göster/Gizle">
            <svg *ngIf="!sifreGorunur" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="sifreGorunur" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="password-rule-box">
          <div class="d-flex align-items-center gap-1 mb-1">
            <span style="color: #16a34a; font-weight: bold;">•</span> 8–12 karakter uzunluğunda olmalıdır.
          </div>
          <div class="d-flex align-items-center gap-1">
            <span style="color: #16a34a; font-weight: bold;">•</span> En az 1 harf, 1 rakam ve 1 özel karakter içermelidir.
          </div>
        </div>
      </div>

      <button type="submit" class="btn-auth-submit" [disabled]="yukleniyor">
        <span *ngIf="yukleniyor" class="spinner-border spinner-border-sm"></span>
        <span>{{ yukleniyor ? 'Kayıt Yapılıyor...' : 'Kayıt Ol ve Başla' }}</span>
      </button>
    </form>

  </div>
</div>
