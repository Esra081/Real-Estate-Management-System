<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-primary mb-0">Taşınmaz Listesi</h2>

    <button
      type="button"
      class="btn btn-success"
      (click)="yeniTasinmaz()">
      + Yeni Taşınmaz
    </button>
  </div>

  <div *ngIf="yukleniyor" class="alert alert-info">
    Veriler yükleniyor, lütfen bekleyin...
  </div>

  <div *ngIf="!yukleniyor && tasinmazlar.length === 0" class="alert alert-warning">
    Henüz kayıtlı taşınmaz bulunmamaktadır.
  </div>

<div class="table-responsive">
    <table class="table table-striped table-hover border">

      <thead class="table-dark">
        <tr>
          <th>Ada No</th>
          <th>Parsel No</th>
          <th>Adres</th>
          <th>Tip</th>
          <th>Alan (M²)</th>
          <th class="text-center">İşlemler</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let item of tasinmazlar">

          <td>{{ item.adaNo }}</td>

          <td>{{ item.parselNo }}</td>

          <td>{{ item.adres }}</td>

          <td>
            <span class="badge bg-secondary">
              {{ item.tasinmazTipi }}
            </span>
          </td>

          <td>
            {{ item.alanM2 }} m²
          </td>

          <td class="text-center">

            <button
              type="button"
              class="btn btn-sm btn-primary me-2"
              (click)="duzenle(item.id)">
              Düzenle
            </button>

            <button
              type="button"
              class="btn btn-sm btn-danger"
              (click)="sil(item.id)">
              Sil
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
